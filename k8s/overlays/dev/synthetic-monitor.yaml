apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-monitor
  labels:
    app: synthetic-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synthetic-monitor
  template:
    metadata:
      labels:
        app: synthetic-monitor
    spec:
      containers:
        - name: monitor
          image: curlimages/curl:8.9.1
          command:
            - sh
            - -c
            - |
              echo "Synthetic monitor started — hitting /dev/api/work-items"
              while true; do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" http://13.216.126.57/dev/api/work-items)
                echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') status=$CODE"
                DELAY=$(awk 'BEGIN{srand(); print int(rand()*10)+1}')
                sleep "$DELAY"
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
